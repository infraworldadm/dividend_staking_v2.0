# CI: website (typecheck, lint, build) and contracts (Foundry tests) on every push / PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: foundry-rs/foundry-toolchain@v1
      - run: npm ci
      - run: git clone --depth 1 https://github.com/foundry-rs/forge-std lib/forge-std
      - run: forge test -vv
